name: Build Nerd Horror 26.3
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'nerd-horror-control/**'
      - '.github/workflows/nerd-horror-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Nerd Horror Fabric 26.3
        run: gradle --no-daemon -p nerd-horror-control build
      - name: Upload Nerd Horror JAR
        uses: actions/upload-artifact@v4
        with:
          name: nerd-horror-control-26.3
          path: nerd-horror-control/build/libs/nerd-horror-control-1.1.0.jar
          if-no-files-found: error
